name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # The web app runs in dev mode against dummy endpoints in CI; the remote
  # Supabase project stays paused by design (PBK-1).
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key
  NEXT_PUBLIC_DEVELOPMENT: "true"

jobs:
  library-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (non-blocking — legacy debt tracked in PBK-5)
        run: npm run lint
        continue-on-error: true
      - name: Unit tests (live-DB smoke test excluded)
        # CLI patterns REPLACE the config's list — repeat e2e/desktop here.
        run: npx jest --testPathIgnorePatterns supabase.test.ts /e2e/ /desktop/ /node_modules/ --passWithNoTests
      - name: Build
        run: npx next build
      - name: Edge functions typecheck
        working-directory: supabase/functions
        run: |
          npm ci
          npm run type-check

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # PBK-30: real browser -> Next production build -> a separate, marked
  # disposable Supabase stack (project pbk30-fixture; auth, PostgREST, storage,
  # Mailpit), synthetic data only. A development stack runs beside it to prove
  # the guarded destructive steps cannot reach it. Remote project stays paused.
  web-local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PBK30_ARTIFACTS: ${{ github.workspace }}/.pbk30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fixture guard refuses wrong targets (unit)
        run: node --test scripts/pbk30-fixture-guard.test.mjs
      - name: Development stack (stands in for a developer's own data)
        run: scripts/local-supabase.sh start
      - name: Fingerprint development stack (read-only)
        run: scripts/pbk30-isolation-check.sh fingerprint "$PBK30_ARTIFACTS/ordinary-fingerprint-before.txt"
      - name: Destructive steps refused before the fixture exists
        run: scripts/pbk30-isolation-check.sh negatives-before-create
      - name: Create marked fixture stack
        run: scripts/pbk30-stack.sh create
      - name: Destructive steps refused against wrong targets
        run: scripts/pbk30-isolation-check.sh negatives-with-fixture
      - name: PBK-30 criteria 2-4, restart, criterion 5, dev mode (fixture)
        run: PBK30_DISPOSABLE=1 scripts/pbk30-verify.sh all
      - name: Destroy fixture stack (guarded)
        run: PBK30_DISPOSABLE=1 scripts/pbk30-stack.sh destroy
      - name: Development stack unchanged
        run: |
          scripts/pbk30-isolation-check.sh fingerprint "$PBK30_ARTIFACTS/ordinary-fingerprint-after.txt"
          diff <(tail -n +2 "$PBK30_ARTIFACTS/ordinary-fingerprint-before.txt") \
               <(tail -n +2 "$PBK30_ARTIFACTS/ordinary-fingerprint-after.txt")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbk30-local-supabase-evidence
          path: .pbk30/
          include-hidden-files: true
          retention-days: 14

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Frontend typecheck
        working-directory: desktop
        run: |
          npm ci
          npx tsc --noEmit -p .
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

  # Packaged desktop E2E (PBK-18, PBK-24 reading, PBK-26 highlights, PBK-15 libraries and search states, PBK-19 catalog import and its search integration, PBK-21 Drop safety): builds the debug
  # .deb, extracts the packaged binary and drives it with tauri-driver against
  # the committed synthetic fixture library and fresh per-run app-data. No dev
  # server, no personal library. Web local-Supabase checks (PBK-30) are separate.
  desktop-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARTIFACTS: ${{ github.workspace }}/desktop-e2e-artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies + WebKitWebDriver + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config \
            webkit2gtk-driver xvfb xdotool
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-e2e
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Synthetic fixtures are committed and current
        working-directory: desktop
        run: npm run fixtures:check
      - name: Build debug package
        working-directory: desktop
        run: npx tauri build --debug --bundles deb
      - name: Extract packaged binary and record identity
        run: |
          set -euo pipefail
          deb=$(ls desktop/src-tauri/target/debug/bundle/deb/*.deb)
          mkdir -p "$ARTIFACTS" pkg
          dpkg-deb -x "$deb" pkg
          app=$(find pkg/usr/bin -maxdepth 1 -type f -perm -u+x | head -n1)
          echo "E2E_APP=$PWD/$app" >> "$GITHUB_ENV"
          { echo "commit=$GITHUB_SHA"; echo "deb=$deb"; sha256sum "$deb" "$app"; } | tee "$ARTIFACTS/build-identity.txt"
      - name: Packaged smoke (fresh app-data)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/run-1" xvfb-run -a npm run test:e2e:packaged
      - name: Packaged smoke rerun (new clean app-data, repeatability)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/run-2" xvfb-run -a npm run test:e2e:packaged
      - name: PBK-24 reading journey (tabs, EPUB/PDF paging, sidecar positions across close/restart/index rebuild, failure paths)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/reading-journey" xvfb-run -a npm run test:e2e:reading
      - name: PBK-26 highlights journey (EPUB/PDF selection, exact anchors, panel, remove, restart, export)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/highlights" xvfb-run -a npm run test:e2e:highlights
      - name: PBK-15 libraries journey (native picker, colliding libraries, isolation, switch/restart, rename/remove/re-add, stale results, missing/unreadable/empty folders, corrupt/unwritable settings and index)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/libraries" xvfb-run -a -s "-screen 0 1280x900x24" npm run test:e2e:libraries
      - name: PBK-15 search states (no match per query, clear/replace recovery, filtered zero, empty library, two libraries, failed listing)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/search-states" xvfb-run -a npm run test:e2e:search-states
      - name: PBK-15 single-library upgrade on a copy (legacy app-data from the repository seeder)
        working-directory: desktop
        run: |
          (cd src-tauri && cargo build --example seed_index)
          E2E_SEED_INDEX="$PWD/src-tauri/target/debug/examples/seed_index" \
            E2E_ARTIFACTS="$ARTIFACTS/library-upgrade" xvfb-run -a npm run test:e2e:library-upgrade
      - name: PBK-19 catalog import journey (refused/preview/import/repeat/changed rows, badges, status/rating facets, search, restart, CLI, library MCP server, other libraries, linked Catalog, quit mid-import)
        working-directory: desktop
        run: |
          (cd src-tauri && cargo build --example import_catalog)
          (cd ../mcp && npm ci)
          E2E_IMPORT_CLI="$PWD/src-tauri/target/debug/examples/import_catalog" \
            E2E_ARTIFACTS="$ARTIFACTS/catalog-import" xvfb-run -a npm run test:e2e:catalog-import
      - name: PBK-19 + PBK-15 catalog search integration (~1700-row sheet import, rescan, title/author search, no match and Clear search, status/rating facets, rapid queries, rerun, other libraries, failed listing, restart)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/catalog-search" xvfb-run -a -s "-screen 0 1280x900x24" npm run test:e2e:catalog-search
      - name: PBK-21 Drop safety journey (confident match filed/linked/on the shelf; link, empty, truncated, occupied and unmatched files kept with reasons; restart; failed catalog write pending, restart + retry finishes it; retry idempotent)
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/acquisition" xvfb-run -a npm run test:e2e:acquisition
      - name: Injected failures exit nonzero, bounded, cleaned up
        working-directory: desktop
        run: E2E_ARTIFACTS="$ARTIFACTS/failures" xvfb-run -a npm run test:e2e:packaged:failures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-evidence
          path: desktop-e2e-artifacts/
          retention-days: 14
